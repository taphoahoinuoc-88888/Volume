auth_policy:
  gate: G2
  status: CLOSED_OWNER_DECIDED
  identity_provider: Supabase Auth only
  internal_roles:
  - ADMIN
  - CEO
  - MANAGER
  - STAFF
  internal_authentication: email_password
  customer_role: USER
  customer_authentication: email_password
  recovery: email_password_recovery
  excluded_sprint1:
  - phone_otp
  - sms
  - google_login
  - apple_login
  - facebook_login
  - telegram_login
  - passkey
  - mfa
  no_future_provider_schema: true
  future_provider_identity: May add later without changing profiles.id = auth.users.id
  signup: Any enabled customer signup defaults USER; internal accounts provisioned by authorized server path; opening
    signup and email-confirmation settings not silently assumed
  operational_configuration: Decide email confirmation/signup opening, recovery redirect/SMTP and production password
    settings before corresponding live provisioning/deployment; test local email recovery without UI in 1A
optimistic_concurrency:
  mutable_entities:
  - profiles
  - venues
  - staff_memberships
  column: version bigint NOT NULL DEFAULT 1
  updated_at: audit/display timestamp only; never equality concurrency token
  new_row: version starts at 1; create has no prior expected_version; unique checks guard races
  update: expected_version required; authorization + row lock + current version comparison; mismatched or missing
    version rejects before write
  on_mutation: increment each changed row version by 1 atomically with updated_at, audit and cutoff if affected;
    same row changes once per command increment once
  multi_row: preview carries expected_version for primary row and expected_profile_version/explicit expected versions
    for each related row to mutate; all comparison+mutation+audit in same transaction
  no_op: NO_CHANGE without mutation/version increment; still checks expected_version first; stale retries always
    VERSION_CONFLICT, never reported successful mutation
  client: cannot set/reset/decrement version; overflow aborts transaction
  test: same updated_at but different version still conflicts; a matching timestamp never overrides stale expected_version
  edit_projections: Return own profile.version, editable venue.version, membership.version and expected_profile_version
    to authorized editing callers; never expose cutoff via roster
gates:
  G1:
    definition: Owner reviews final Sprint0 contract and explicitly authorizes Checkpoint 1A; basic architecture
      approval alone is insufficient
    status: PENDING_OWNER_AUTHORIZATION_1A
    required_before: Checkpoint 1A
    resolution: Explicit owner approval to implement 1A; does not authorize 1B
  G2:
    definition: V1 internal ADMIN/CEO/MANAGER/STAFF and customer USER authenticate email+password; email password
      recovery; Supabase Auth only; no phone/SMS/social/Telegram/passkey/MFA or prep schema in Sprint1
    status: CLOSED_OWNER_DECIDED
    required_before: Checkpoint 1A
    resolution: Owner decided 2026-10-06; operational email/signup settings separately documented, not an undecided
      provider gate
  G3:
    definition: 'Meaning of open-table payment: deposit, prepaid amount or operational confirmation'
    status: OPEN
    required_before: Sprint 2
    resolution: Owner-approved payment business meaning
  G4:
    definition: Amount/currency, payment method, who may confirm and confirmation responsibility
    status: OPEN
    required_before: Sprint 2
    resolution: Owner-approved amount/method/authority rules
  G5:
    definition: Pending table hold duration, expiry/cancellation, late confirmation and retry handling
    status: OPEN
    required_before: Sprint 2
    resolution: Owner-approved pending lifecycle
  G6:
    definition: When hourly rate snapshots and playing time start; check-in effect if any
    status: OPEN
    required_before: Sprint 2
    resolution: Owner-approved pricing/time start semantics
  G7:
    definition: 'CEO metric definitions: sessions/occupancy vs collected revenue; business day/timezone'
    status: OPEN
    required_before: Sprint 2
    resolution: Owner-approved aggregate metrics
  G8:
    definition: Close-session rounding/minimum charge, final amount, close authority, corrections, settlement/refund
    status: OPEN
    required_before: Sprint 3
    resolution: Owner-approved closing/billing rules
  G9:
    definition: Player public visibility/rank/achievement, verified results/draws/disputes/corrections and Match
      Media privacy
    status: DEFERRED
    required_before: Player Sprint4; media privacy before Sprint5
    resolution: Approve each relevant Player/Media rule before module work
  G10:
    definition: Tournament formats/eligibility/fees and suitability/storage adapter for brackets-manager.js using
      same Match Core
    status: DEFERRED
    required_before: Sprint 6
    resolution: Approved tournament contract and justified library choice
  G11:
    definition: Shop stock hold/expiry, fulfillment/refund and reuse of central payments
    status: DEFERRED
