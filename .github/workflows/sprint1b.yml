name: Checkpoint 1B
on:
  push:
    branches: [checkpoint-1b, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sprint1b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  required-product:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact 1B allowlist, frozen core and secret scan
        run: |
          python - <<'PY'
          import pathlib,re,subprocess,json,tomllib
          sprint2_stage=subprocess.run(['git','merge-base','--is-ancestor','7adfafe261eb97a331c5c3f85368afe557d1cf60','HEAD']).returncode==0
          if sprint2_stage:
            approved='7adfafe261eb97a331c5c3f85368afe557d1cf60'
            base='2b47f0a619f494a811c94e41697f7d09dcb19e3a'
            plan=subprocess.check_output(['git','show',approved+':docs/sprints/SPRINT_2_IMPLEMENTATION_PLAN.md'],text=True)
            allowed=set(plan.split(chr(96)*3+'text'+chr(10))[1].split(chr(10)+chr(96)*3)[0].splitlines())
            allowed.update(['supabase/functions/open-table-payment/index.ts','supabase/config.toml'])
            assert len(allowed)==45
            allowed.update(['docs/sprints/SPRINT_3_SPEC.md','tests/e2e/fixtures/auth.ts']) # Owner-authorized SPEC and exact load synchronization only.
            changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
            assert set(changed)<=allowed,'Outside45-path Sprint2 allowlist:'+str(set(changed)-allowed)
            fixture_path='tests/e2e/fixtures/auth.ts'
            fixture_base=subprocess.check_output(['git','show',base+':'+fixture_path],text=True)
            fixture_line=" else await expect(page.getByRole('heading',{name:'Xin chào,'+' '+name})).toBeVisible();"
            assert pathlib.Path(fixture_path).read_text()==fixture_base.replace(fixture_line,fixture_line+chr(10)+" await page.waitForLoadState('load');"),'Only exact login document-load synchronization authorized'
            for prefix in ['AGENTS.md','docs/blueprint.yaml','docs/permissions.md','docs/architecture.md','docs/decisions','supabase/migrations/20261006000100_identity_scope.sql','supabase/migrations/20261006000200_permissions_rpc_audit.sql','supabase/migrations/20261006000300_access_read_projections.sql','supabase/tests/sprint1_rls.test.sql','supabase/tests/sprint1_rpc_audit.test.sql','supabase/tests/sprint1_revocation.test.sql','supabase/tests/sprint1_versions.test.sql','supabase/tests/sprint1_concurrency.test.sql','supabase/tests/sprint1_auth_bootstrap.test.sql','supabase/tests/sprint1_projections.test.sql','tests/integration/fixtures/auth.ts','tests/integration/sprint1-api.test.ts','tests/integration/sprint1-projections.test.ts','tests/integration/sprint1-revocation.test.ts','tests/integration/sprint1-versions.test.ts','tests/integration/sprint1-concurrency.test.ts','tests/integration/sprint1-auth-recovery.test.ts','tests/e2e/sprint1-auth.spec.ts','tests/e2e/sprint1-permissions.spec.ts','tests/e2e/sprint1-admin.spec.ts','tests/e2e/sprint1-mobile.spec.ts','supabase/seed.sql','package-lock.json']:
             assert not subprocess.check_output(['git','diff','--name-only',base,'HEAD','--',prefix],text=True).strip(),'Frozen contract/test/dependency changed:'+prefix
            old=json.loads(subprocess.check_output(['git','show',base+':package.json'],text=True));now=json.loads(pathlib.Path('package.json').read_text())
            for key in ['dependencies','devDependencies','workspaces']:assert old[key]==now[key],'Unapproved dependency/workspace change:'+key
            old_config=tomllib.loads(subprocess.check_output(['git','show',base+':supabase/config.toml'],text=True));new_config=tomllib.loads(pathlib.Path('supabase/config.toml').read_text())
            assert new_config.pop('functions')=={'open-table-payment':{'verify_jwt':True}},'Only authenticated opening function allowed'
            assert new_config['edge_runtime']['enabled'] is True
            new_config['edge_runtime']['enabled']=old_config['edge_runtime']['enabled']
            assert new_config==old_config,'Frozen Auth/API/security config modified'
            for workflow,start,end in [('.github/workflows/sprint1a.yml','      - name: Scope, frozen documents and secret scan'+chr(10),'      - name: Install locked core test dependencies'+chr(10)),('.github/workflows/sprint1b.yml','      - name: Exact 1B allowlist, frozen core and secret scan'+chr(10),'      - name: Locked dependencies, typecheck, lint, unit tests, dependency audit'+chr(10))]:
             old_workflow=subprocess.check_output(['git','show',base+':'+workflow],text=True);new_workflow=pathlib.Path(workflow).read_text()
             assert old_workflow.split(start)[0]==new_workflow.split(start)[0] and old_workflow.split(end)[1]==new_workflow.split(end)[1],'Frozen runtime/security steps changed:'+workflow
            for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
             data=pathlib.Path(name).read_text()
             assert not re.search(r'sb_secret_[A-Za-z0-9_-]{15,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}',data),'Secret-like value:'+name
             assert not name.startswith('reference/'),'Legacy edited:'+name
             assert not re.search(r'/(?:player|matches|video|tournament|shop|telegram|crm|ai|billing|refund)/',name,re.I),'Forbidden future module:'+name
             if name.startswith(('apps/','packages/')):assert 'SUPABASE_DB_URL' not in data and 'payment-adapter' not in data and 'service_role' not in data,'Server capability in client:'+name
            print('PASS exact45-path scope; immutable Sprint1 migrations/Auth/security/tests; no secret/future module; JWT verification TRUE')
          else:
            product='9ba95b1d9f7372168051c2311d242ec799afc033'
            text=subprocess.check_output(['git','show',product+':docs/sprints/SPRINT_1.md'],text=True)
            block=text.split('### Planned exact file allowlist 1B')[1].split('## Playwright')[0]
            allowed=set(re.findall(r'^- `([^`]+)`',block,re.M))
            allowed.add('.github/workflows/sprint1a.yml') # Owner-approved CI-only maintenance.
            implementation=subprocess.check_output(['git','diff','--name-only',product,'HEAD','--','apps','packages','tests','supabase','package.json','package-lock.json','tsconfig.base.json','vitest.config.ts','playwright.config.ts'],text=True)
            assert not implementation.strip(),'Tested implementation modified:'+implementation
            old=subprocess.check_output(['git','show','68541f8a71a0ae10ac22d819a79f78982cf37abb:.github/workflows/sprint1a.yml'],text=True)
            now=pathlib.Path('.github/workflows/sprint1a.yml').read_text()
            start='      - name: Scope, frozen documents and secret scan'+chr(10)
            end='      - name: Install locked core test dependencies'+chr(10)
            assert old.split(start)[0]==now.split(start)[0] and old.split(end)[1]==now.split(end)[1],'Frozen1A runtime checks modified'
            changed=subprocess.check_output(['git','diff','--name-only','68541f8a71a0ae10ac22d819a79f78982cf37abb','HEAD'],text=True).splitlines()
            assert set(changed)<=allowed,'Outside1B allowlist:'+str(set(changed)-allowed)
            core=subprocess.check_output(['git','diff','--name-only','68541f8a71a0ae10ac22d819a79f78982cf37abb','HEAD','--','supabase','tests/integration','AGENTS.md','docs/blueprint.yaml','docs/permissions.md','docs/architecture.md','docs/decisions'],text=True)
            assert not core.strip(),'Frozen core modified:'+core
            for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              data=pathlib.Path(name).read_text()
              assert not re.search(r'sb_secret_[A-Za-z0-9_-]{15,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}',data),'Secret-like value:'+name
            print('PASS:56-path1B allowlist plus CI-only maintenance; frozen security/core/tests unchanged; no future schema/module; secret scan')
          PY
      - name: Locked dependencies, typecheck, lint, unit tests, dependency audit
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:unit
          npm audit --audit-level=high
      - name: Pin Supabase and start real local stack
        run: |
          npm install --global supabase@2.119.0
          test "$(supabase --version)" = '2.119.0'
          if ! supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            python - <<'PY'
          import os,pathlib,re
          data=pathlib.Path(os.environ['RUNNER_TEMP']+'/supabase-start.log').read_text()
          for line in data.splitlines():
            if re.search(r'error|failed|SQLSTATE|Applying migration',line,re.I):
              print(re.sub(r'eyJ[A-Za-z0-9_.-]+|sb_(?:secret|publishable)_[A-Za-z0-9_-]+','[REDACTED]',line))
          PY
            exit 1
          fi
          supabase db reset
          docker exec supabase_db_volume-v2 psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "alter role volume_session_reader bypassrls; grant usage on schema auth to volume_session_reader; grant select(id,user_id,created_at) on auth.sessions to volume_session_reader;"
      - name: Frozen 1A complete regression on real backend
        run: |
          supabase test db
          npm run test:integration
      - name: Public browser environment and production build
        run: |
          supabase status -o json > "$RUNNER_TEMP/local-status.json"
          python - <<'PY'
          import os,json,pathlib
          data=json.loads(pathlib.Path(os.environ['RUNNER_TEMP']+'/local-status.json').read_text())
          assert data['API_URL'].startswith('http://127.0.0.1:')
          content='VITE_SUPABASE_URL='+data['API_URL']+'\nVITE_SUPABASE_ANON_KEY='+data['ANON_KEY']+'\nVITE_CUSTOMER_URL=http://127.0.0.1:3000\n'
          for app in ['customer','control-center']:pathlib.Path('apps',app,'.env').write_text(content)
          PY
          npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Actual browser/backend Auth, roles, venue scope and confirmations
        run: npm run test:e2e
      - name: Redact test credentials before artifact upload
        if: always()
        run: |
          python - <<'PY'
          import pathlib,re
          for p in pathlib.Path('test-results').rglob('*'):
            if p.suffix in {'.json','.md','.txt'}:
              content=p.read_text()
              content=re.sub(r'Local-[0-9a-f-]+!|Recovered-browser-password-2026!|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|sb_secret_[A-Za-z0-9_-]+','[REDACTED]',content)
              content=re.sub(r'([?&](?:token|token_hash|access_token|refresh_token)=)[^&\s\"\'<>]+',r'\1[REDACTED]',content)
              p.write_text(content)
          PY
      - name: Browser screenshots and report evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-1b-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Required evidence summary
        run: |
          echo "Checkpoint1B required tests PASS for $GITHUB_SHA; real Supabase CLI2.119.0, Chromium/WebKit desktop1440/mobile390/320; frozen78 DB/27 API regression; no Sprint2." >> "$GITHUB_STEP_SUMMARY"
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

